<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linear Solver Pro | Ma trận nghịch đảo</title>
<!-- MathJax để render công thức toán học tuyệt đẹp -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
    svg: { fontCache: 'global' },
    startup: { typeset: true }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
<!-- Font chữ hiện đại -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-dark: #050511;
    --glass-bg: rgba(20, 25, 40, 0.6);
    --glass-border: rgba(255, 255, 255, 0.08);
    --primary: #00f2ff;
    --secondary: #7000ff;
    --accent: #ff0055;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --success: #00ff9d;
  }

  * { box-sizing: border-box; outline: none; }

  body {
    margin: 0;
    font-family: 'Outfit', sans-serif;
    background-color: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(112, 0, 255, 0.15), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(0, 242, 255, 0.15), transparent 40%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  /* Header */
  header { text-align: center; margin-bottom: 40px; animation: fadeInDown 0.8s ease; }
  h1 {
    font-size: 3rem; font-weight: 800; margin: 0;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: -1px;
  }
  .subtitle { color: var(--text-muted); font-size: 1.1rem; margin-top: 8px; font-weight: 300; }

  /* Glass Card */
  .glass-card {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 30px;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    margin-bottom: 30px;
    animation: fadeInUp 0.8s ease;
  }

  /* Controls */
  .controls {
    display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 25px;
    padding-bottom: 20px; border-bottom: 1px solid var(--glass-border);
  }
  select, button {
    font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 0.95rem;
    padding: 10px 20px; border-radius: 12px; border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.05); color: var(--text-main); cursor: pointer;
    transition: all 0.3s ease;
  }
  select:hover, button:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--primary); }
  
  .btn-solve {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #000; border: none; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
  }
  .btn-solve:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 242, 255, 0.5); }
  .btn-ghost { color: var(--text-muted); border-color: transparent; }
  .btn-ghost:hover { color: var(--accent); }

  /* Matrix Input Layout */
  .equation-layout {
    display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap;
  }
  .matrix-wrapper { text-align: center; }
  .matrix-label {
    font-family: 'JetBrains Mono', monospace; color: var(--primary); 
    font-size: 1.2rem; margin-bottom: 10px; font-weight: 700;
  }
  .matrix-grid {
    display: grid; gap: 8px; padding: 15px;
    background: rgba(0, 0, 0, 0.2); border-radius: 16px;
    border: 1px solid var(--glass-border);
  }
  .matrix-input {
    width: 60px; height: 45px; text-align: center;
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border);
    color: var(--text-main); font-family: 'JetBrains Mono', monospace; font-size: 1.1rem;
    border-radius: 8px; transition: all 0.2s;
  }
  .matrix-input:focus {
    border-color: var(--primary); background: rgba(0, 242, 255, 0.05);
    box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
  }
  .operator { font-size: 2rem; color: var(--text-muted); font-weight: 300; }

  /* Results Area */
  #resultsArea { display: none; }
  .step-block {
    background: rgba(0, 0, 0, 0.2); border-left: 4px solid var(--secondary);
    border-radius: 0 12px 12px 0; padding: 20px; margin-bottom: 20px;
    animation: fadeIn 0.5s ease forwards; opacity: 0;
  }
  .step-block:nth-child(1) { animation-delay: 0.1s; border-color: var(--primary); }
  .step-block:nth-child(2) { animation-delay: 0.3s; border-color: var(--secondary); }
  .step-block:nth-child(3) { animation-delay: 0.5s; border-color: var(--success); }
  
  .step-title {
    font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 10px;
  }
  .step-desc { color: var(--text-muted); margin-bottom: 15px; font-size: 0.95rem; line-height: 1.5; }
  .math-display { overflow-x: auto; padding: 10px 0; }
  
  .tag-error {
    background: rgba(255, 0, 85, 0.15); color: var(--accent); border: 1px solid var(--accent);
    padding: 15px; border-radius: 12px; text-align: center; font-weight: 600;
  }

  /* Animations */
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

  /* Responsive */
  @media (max-width: 768px) {
    h1 { font-size: 2rem; }
    .equation-layout { flex-direction: column; gap: 15px; }
    .operator { transform: rotate(90deg); margin: 10px 0; }
    .matrix-input { width: 50px; height: 40px; font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Linear Solver Pro</h1>
  <div class="subtitle">Giải hệ phương trình tuyến tính bằng Phương pháp Ma trận Nghịch đảo ($X = A^{-1}B$)</div>
</header>

<div class="glass-card">
  <div class="controls">
    <select id="sizeSelect" onchange="buildGrid()">
      <option value="2">Hệ 2 ẩn (2 × 2)</option>
      <option value="3" selected>Hệ 3 ẩn (3 × 3)</option>
      <option value="4">Hệ 4 ẩn (4 × 4)</option>
    </select>
    <button class="btn-ghost" onclick="randomize()">🎲 Ngẫu nhiên</button>
    <button class="btn-ghost" onclick="clearGrid()">🧹 Xoá hết</button>
    <div style="flex:1"></div>
    <button class="btn-solve" onclick="solveSystem()">⚡ Giải hệ phương trình</button>
  </div>

  <div class="equation-layout">
    <div class="matrix-wrapper">
      <div class="matrix-label">Ma trận hệ số A</div>
      <div id="matrixA" class="matrix-grid"></div>
    </div>
    
    <div class="operator">×</div>
    
    <div class="matrix-wrapper">
      <div class="matrix-label">Ma trận ẩn X</div>
      <div id="matrixX" class="matrix-grid"></div>
    </div>
    
    <div class="operator">=</div>
    
    <div class="matrix-wrapper">
      <div class="matrix-label">Ma trận tự do B</div>
      <div id="matrixB" class="matrix-grid"></div>
    </div>
  </div>
</div>

<div id="resultsArea" class="glass-card">
  <div id="outputContent"></div>
</div>

<script>
/* ============================================================
   1. CLASS PHÂN SỐ (FRACTION) - Đảm bảo tính toán chính xác
   ============================================================ */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }

class Frac {
  constructor(n, d = 1) {
    if (d === 0) throw new Error("Mẫu số bằng 0");
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(Math.abs(n), Math.abs(d));
    this.n = n / g; this.d = d / g;
  }
  add(o) { o = toFrac(o); return new Frac(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { o = toFrac(o); return new Frac(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { o = toFrac(o); return new Frac(this.n * o.n, this.d * o.d); }
  div(o) { o = toFrac(o); return new Frac(this.n * o.d, this.d * o.n); }
  neg() { return new Frac(-this.n, this.d); }
  isZero() { return this.n === 0; }
  toNum() { return this.n / this.d; }
  toLatex() {
    if (this.n === 0) return '0';
    if (this.d === 1) return `${this.n}`;
    return `\\frac{${this.n}}{${this.d}}`;
  }
}

function toFrac(x) {
  if (x instanceof Frac) return x;
  if (Number.isInteger(x)) return new Frac(x, 1);
  const s = x.toString();
  const dot = s.indexOf('.');
  if (dot === -1) return new Frac(x, 1);
  const dec = s.length - dot - 1;
  return new Frac(Math.round(x * Math.pow(10, dec)), Math.pow(10, dec));
}

/* ============================================================
   2. CÁC HÀM TOÁN HỌC MA TRẬN
   ============================================================ */
function createMatrix(n, val = 0) {
  return Array.from({ length: n }, () => Array(n).fill(new Frac(val)));
}
function cloneMat(M) { return M.map(r => r.map(v => new Frac(v.n, v.d))); }
function identity(n) {
  const I = createMatrix(n);
  for (let i = 0; i < n; i++) I[i][i] = new Frac(1);
  return I;
}
function matMul(A, B) {
  const r = A.length, c = B[0].length, k = A[0].length;
  const C = Array.from({ length: r }, () => Array(c).fill(new Frac(0)));
  for (let i = 0; i < r; i++)
    for (let j = 0; j < c; j++)
      for (let t = 0; t < k; t++)
        C[i][j] = C[i][j].add(A[i][t].mul(B[t][j]));
  return C;
}

// Định thức bằng khử Gauss
function getDet(M) {
  const n = M.length;
  const A = cloneMat(M);
  let det = new Frac(1);
  for (let i = 0; i < n; i++) {
    let pivot = i;
    while (pivot < n && A[pivot][i].isZero()) pivot++;
    if (pivot === n) return new Frac(0);
    if (pivot !== i) { [A[i], A[pivot]] = [A[pivot], A[i]]; det = det.neg(); }
    det = det.mul(A[i][i]);
    for (let j = i + 1; j < n; j++) {
      if (A[j][i].isZero()) continue;
      const factor = A[j][i].div(A[i][i]);
      for (let k = i; k < n; k++) A[j][k] = A[j][k].sub(factor.mul(A[i][k]));
    }
  }
  return det;
}

// Ma trận nghịch đảo bằng Gauss-Jordan
function getInverse(M) {
  const n = M.length;
  const left = cloneMat(M);
  const right = identity(n);
  
  for (let col = 0; col < n; col++) {
    let pivot = col;
    while (pivot < n && left[pivot][col].isZero()) pivot++;
    if (pivot === n) return null; // Không khả nghịch
    
    if (pivot !== col) {
      [left[pivot], left[col]] = [left[col], left[pivot]];
      [right[pivot], right[col]] = [right[col], right[pivot]];
    }
    
    const pv = left[col][col];
    for (let j = 0; j < n; j++) {
      left[col][j] = left[col][j].div(pv);
      right[col][j] = right[col][j].div(pv);
    }
    
    for (let i = 0; i < n; i++) {
      if (i === col) continue;
      const factor = left[i][col];
      if (factor.isZero()) continue;
      for (let j = 0; j < n; j++) {
        left[i][j] = left[i][j].sub(factor.mul(left[col][j]));
        right[i][j] = right[i][j].sub(factor.mul(right[col][j]));
      }
    }
  }
  return right;
}

// Chuyển ma trận sang LaTeX
function matToLatex(M) {
  const rows = M.map(r => r.map(x => x.toLatex()).join(' & ')).join(' \\\\ ');
  return `\\begin{bmatrix} ${rows} \\end{bmatrix}`;
}
function vecToLatex(V) {
  const rows = V.map(x => x.toLatex()).join(' \\\\ ');
  return `\\begin{bmatrix} ${rows} \\end{bmatrix}`;
}

/* ============================================================
   3. UI LOGIC
   ============================================================ */
function buildGrid() {
  const n = parseInt(document.getElementById('sizeSelect').value);
  
  // Matrix A (n x n)
  const containerA = document.getElementById('matrixA');
  containerA.innerHTML = ''; containerA.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const inp = document.createElement('input');
      inp.type = 'number'; inp.step = 'any'; inp.className = 'matrix-input';
      inp.id = `a-${i}-${j}`; inp.value = 0;
      containerA.appendChild(inp);
    }
  }

  // Matrix X (n x 1) - Chỉ để hiển thị, không nhập
  const containerX = document.getElementById('matrixX');
  containerX.innerHTML = ''; containerX.style.gridTemplateColumns = `1fr`;
  for (let i = 0; i < n; i++) {
    const inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'matrix-input'; inp.readOnly = true;
    inp.style.background = 'rgba(0, 242, 255, 0.05)'; inp.style.borderColor = 'var(--primary)';
    inp.id = `x-${i}`; inp.value = '?';
    containerX.appendChild(inp);
  }

  // Matrix B (n x 1)
  const containerB = document.getElementById('matrixB');
  containerB.innerHTML = ''; containerB.style.gridTemplateColumns = `1fr`;
  for (let i = 0; i < n; i++) {
    const inp = document.createElement('input');
    inp.type = 'number'; inp.step = 'any'; inp.className = 'matrix-input';
    inp.id = `b-${i}`; inp.value = 0;
    containerB.appendChild(inp);
  }
}

function getMatrices() {
  const n = parseInt(document.getElementById('sizeSelect').value);
  const A = [], B = [];
  for (let i = 0; i < n; i++) {
    const rowA = [];
    for (let j = 0; j < n; j++) rowA.push(toFrac(document.getElementById(`a-${i}-${j}`).value || 0));
    A.push(rowA);
    B.push([toFrac(document.getElementById(`b-${i}`).value || 0)]);
  }
  return { A, B, n };
}

function randomize() {
  const n = parseInt(document.getElementById('sizeSelect').value);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) document.getElementById(`a-${i}-${j}`).value = Math.floor(Math.random() * 11) - 5;
    document.getElementById(`b-${i}`).value = Math.floor(Math.random() * 21) - 10;
  }
}

function clearGrid() {
  const n = parseInt(document.getElementById('sizeSelect').value);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) document.getElementById(`a-${i}-${j}`).value = 0;
    document.getElementById(`b-${i}`).value = 0;
    document.getElementById(`x-${i}`).value = '?';
  }
  document.getElementById('resultsArea').style.display = 'none';
}

function solveSystem() {
  const { A, B, n } = getMatrices();
  const resultsArea = document.getElementById('resultsArea');
  const output = document.getElementById('outputContent');
  resultsArea.style.display = 'block';
  output.innerHTML = '<div style="text-align:center; padding:20px; color:var(--primary);">⏳ Đang tính toán...</div>';

  setTimeout(() => {
    try {
      const det = getDet(A);
      if (det.isZero()) {
        output.innerHTML = `
          <div class="tag-error">
            ⚠️ HỆ PHƯƠNG TRÌNH KHÔNG CÓ NGHIỆM DUY NHẤT<br>
            <span style="font-size:0.9rem; font-weight:400;">Định thức của ma trận A bằng 0 ($\\det(A) = 0$). Ma trận A không khả nghịch, do đó không thể giải bằng phương pháp ma trận nghịch đảo.</span>
          </div>`;
      } else {
        const A_inv = getInverse(A);
        const X = matMul(A_inv, B);
        
        // Cập nhật UI ma trận X
        for(let i=0; i<n; i++) {
          document.getElementById(`x-${i}`).value = X[i][0].toLatex().replace('\\frac{', '').replace('}', '').replace('}', ''); // Hiển thị gọn
        }

        let html = '';
        
        // Bước 1: Mô hình hóa
        html += `<div class="step-block">
          <div class="step-title" style="color:var(--primary)">📌 Bước 1: Mô hình hóa hệ phương trình</div>
          <div class="step-desc">Hệ phương trình được viết dưới dạng ma trận: $A \\cdot X = B$</div>
          <div class="math-display">$$${matToLatex(A)} \\cdot X = ${matToLatex(B)}$$</div>
        </div>`;

        // Bước 2: Tính định thức
        html += `<div class="step-block">
          <div class="step-title" style="color:var(--secondary)">📌 Bước 2: Kiểm tra điều kiện khả nghịch</div>
          <div class="step-desc">Tính định thức của ma trận A. Nếu $\\det(A) \\neq 0$, ma trận A khả nghịch.</div>
          <div class="math-display">$$\\det(A) = ${det.toLatex()} \\neq 0 \\quad \\Rightarrow \\quad \\text{Ma trận A khả nghịch}$$</div>
        </div>`;

        // Bước 3: Ma trận nghịch đảo
        html += `<div class="step-block">
          <div class="step-title" style="color:var(--secondary)">📌 Bước 3: Tìm ma trận nghịch đảo $A^{-1}$</div>
          <div class="step-desc">Sử dụng phương pháp Gauss-Jordan trên ma trận mở rộng $[A | I]$ để tìm $A^{-1}$.</div>
          <div class="math-display">$$A^{-1} = ${matToLatex(A_inv)}$$</div>
        </div>`;

        // Bước 4: Nhân ma trận
        html += `<div class="step-block">
          <div class="step-title" style="color:var(--success)">📌 Bước 4: Tính ma trận nghiệm $X = A^{-1} \\cdot B$</div>
          <div class="step-desc">Nhân ma trận nghịch đảo $A^{-1}$ với ma trận cột $B$.</div>
          <div class="math-display">$$X = ${matToLatex(A_inv)} \\cdot ${matToLatex(B)} = ${matToLatex(X)}$$</div>
        </div>`;

        // Kết luận
        let conclusion = 'Vậy hệ phương trình có nghiệm duy nhất: <br>';
        const varNames = ['x', 'y', 'z', 't', 'u', 'v'];
        for(let i=0; i<n; i++) {
          conclusion += `$${varNames[i] || 'x_'+i} = ${X[i][0].toLatex()}$ &nbsp;&nbsp; `;
        }
        html += `<div class="step-block" style="border-color: var(--primary); background: rgba(0, 242, 255, 0.05);">
          <div class="step-title" style="color:var(--primary)">🏆 Kết luận</div>
          <div class="step-desc" style="font-size: 1.1rem; color: var(--text-main);">${conclusion}</div>
        </div>`;

        output.innerHTML = html;
        
        // Render MathJax
        if (window.MathJax && window.MathJax.typesetPromise) {
          MathJax.typesetPromise([resultsArea]).catch(err => console.error(err));
        }
      }
    } catch (e) {
      output.innerHTML = `<div class="tag-error">⚠️ Lỗi tính toán: ${e.message}</div>`;
    }
  }, 300); // Delay nhỏ để tạo cảm giác "đang xử lý"
}

// Khởi tạo khi load trang
window.addEventListener('load', () => {
  buildGrid();
  // Dữ liệu mẫu đẹp mắt cho 3x3
  const sampleA = [[2, 1, -1], [-3, -1, 2], [-2, 1, 2]];
  const sampleB = [[8], [-11], [-3]];
  for(let i=0; i<3; i++) {
    for(let j=0; j<3; j++) document.getElementById(`a-${i}-${j}`).value = sampleA[i][j];
    document.getElementById(`b-${i}`).value = sampleB[i][0];
  }
});
</script>
</body>
</html>
